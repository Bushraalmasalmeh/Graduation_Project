<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Settings</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png"></link>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar sidebar-settings" id="sidebar">
            <div class="sidebar-user-profile">
                <i class="fas fa-user-circle"></i>
                <h5 class="user-name" id="user-name">Loading...</h5>
                <p class="user-email text-muted" id="user-email">...</p>
            </div>
            <ul class="sidebar-nav">
                <li class="sidebar-item"><a href="settings.html"><i class="fas fa-user-cog"></i><span>Account</span></a></li>
                <li class="sidebar-item"><a href="sysControll.html"><i class="fa-solid fa-screwdriver-wrench"></i><span>System settings</span></a></li>
                <li class="sidebar-item active"><a href="settings-security.html"><i class="fas fa-shield-alt"></i><span>Security</span></a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>
        <main class="main-content" id="main-content">
            <nav class="navbar">
                <div class="container-fluid">
                    <button class="btn btn-outline-light d-lg-none me-3" id="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand">Security Settings</span>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 flex-row">
                        <li class="nav-item">
                           <a class="nav-link" href="dashboard.html"><i class="fas fa-times"></i> Close Settings</a>
                        </li>
                    </ul>
                </div>
            </nav>
            <div class="container-fluid content-inner">
                <div class="content-box">
                    <h5 class="content-box-title">Change Password</h5>
                    <hr class="profile-divider">
                    <form id="change-password-form">
                        <div class="mb-3">
                            <label for="current-password">Current Password</label>
                            <input type="password" id="current-password" name="current_password" class="form-control-dark">
                        </div>
                        <div class="mb-3">
                            <label for="new-password">New Password</label>
                            <input type="password" id="new-password" name="new_password" class="form-control-dark">
                        </div>
                        <div class="mb-3">
                            <label for="confirm-new-password">Confirm New Password</label>
                            <input type="password" id="confirm-new-password" name="confirm_new_password" class="form-control-dark">
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary-custom">Save Password</button>
                        </div>
                    </form>
                </div>

                <div class="content-box mt-4">
                     <h5 class="content-box-title">Sign Out of All Devices</h5>
                     <p class="text-muted">This will sign you out of all other active sessions on other devices.</p>
                     <div class="text-end">
                         <button class="btn btn-secondary-custom">Sign Out of All Devices</button>
                     </div>
                </div>
            </div>
            </main>
        </div>
        <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api-client.js"></script>
    
    <script src="assets/js/app.js"></script>
</body>
</body>
</html>
