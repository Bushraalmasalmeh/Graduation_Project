<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - ELECTRA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- ملفات التصميم الخاصة بنا -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="sidebar-header">
                    <h3>ELECTRA</h3>
                </div>
                <ul class="sidebar-nav">
                    <li class="sidebar-item active">
                        <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
                    </li>
                    <li class="sidebar-item">
                        <a href="chargers.html"><i class="fas fa-charging-station"></i><span>Chargers</span></a>
                    </li>
                    <li class="sidebar-item">
                        <a href="users.html"><i class="fas fa-users"></i><span>Users</span></a>
                    </li>
                    <li class="sidebar-item">
                        <a href="bookings.html"><i class="fas fa-calendar-check"></i><span>Bookings</span></a>
                    </li>
                    <li class="sidebar-item">
                        <a href="reports.html"><i class="fas fa-file-alt"></i><span>Reports</span></a>
                    </li>
                    <li class="sidebar-item">
                        <a href="support.html"><i class="fas fa-envelope-open-text"></i><span>Inbox</span></a>
                    </li>
                </ul>
            </div>
            <div class="sidebar-footer">
                <ul class="sidebar-nav">
                    <li class="sidebar-item">
                        <a href="settings.html"><i class="fas fa-cog"></i><span>Settings</span></a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <span class="navbar-brand">Dashboard</span>
                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="sysControll.html"><i class="fa-solid fa-screwdriver-wrench"></i></a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="settings.html"><i class="fas fa-user-circle"></i></a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Dashboard Content -->
            <div class="container-fluid content-inner">
                <p class="text-muted mb-4">
                    Overview of all system activities in one place.
                </p>

                <!-- Stats Row -->
                <div class="row g-4 mb-4">
                    <div class="col-lg-4 col-md-6">
                        <div class="stat-card">
                            <div class="card-body d-flex align-items-center">
                                <div class="stat-icon"><i class="fas fa-users"></i></div>
                                <div class="stat-content">
                                    <p class="card-title text-muted">Total Users</p>
                                    <h3 class="card-text" id="stats-total-users">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-6">
                        <div class="stat-card">
                            <div class="card-body d-flex align-items-center">
                                <div class="stat-icon">
                                    <i class="fas fa-charging-station"></i>
                                </div>
                                <div class="stat-content">
                                    <p class="card-title text-muted">Total Chargers</p>
                                    <h3 class="card-text" id="stats-total-chargers">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-4 col-md-6">
                        <div class="stat-card">
                            <div class="card-body d-flex align-items-center">
                                <div class="stat-icon"><i class="fas fa-bolt"></i></div>
                                <div class="stat-content">
                                    <p class="card-title text-muted">Active Sessions</p>
                                    <h3 class="card-text" id="stats-active-sessions">0</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Latest Reservations (Inside Content Box) -->
                <div class="content-box">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="content-box-title mb-0">Latest Reservations</h5>
                        
                        <a href="bookings.html" class="btn btn-sm btn-secondary-custom">View All</a>
                    </div>

                    <div class="table-responsive">
                        <table class="table custom-table align-middle">
                            <thead>
                                <tr>
                                    <th>Reservation ID</th>
                                    <th>User</th>
                                    <th>Charger</th>
                                    <th>Duration</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recent-bookings-body">
                                <!-- Data populated by app.js -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api-client.js"></script>

    <script src="assets/js/app.js"></script>
</body>
</body>

</html>
