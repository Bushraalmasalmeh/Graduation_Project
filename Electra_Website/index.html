<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta tags for responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    </link>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Login form container -->
    <form id="login-form" action="" class="login-form">
        <!-- Brand header -->
        <h1>Electra</h1>
        <p>Please Sign in To Manage Charging Stations</p>

        <!-- Login form fields -->
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email" autocomplete="email" required><br><br>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your Password" required><br><br>

        <!-- Remember me and forgot password section -->
        <div class="login-footer">
            <div>
                <input type="checkbox" value="checkbox" id="rememberMe">
                <span for="rememberMe">Remember Me</span>
            </div>
            <a href="forget-password.html">forget password?</a>
        </div>

        <!-- Submit button -->
        <input type="submit" value="Sign In">
    </form>
    <script src="assets/js/config.js"></script>

    <script src="assets/js/utils.js"></script>

    <script src="assets/js/api-client.js"></script>

    <script src="assets/js/auth.js"></script> 
</body>
</body>

</html>
