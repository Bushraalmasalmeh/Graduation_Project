<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ELECTRA</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="container">
        <div class="row min-vh-100 justify-content-center align-items-center">
            <div class="col-12">
                <form id="forgot-password-form" class="login-form" style="margin-top: 160px;">
                 
                    
                    <p class="form-title" style="color: var(--primary-color);">Forget Your Password?</p>
                    
                    <p class="form-description">
                        Enter the email address associated with your account and we will send you a link to reset your password.
                    </p>

                    <label for="email-input">Email Address</label>
                    <input type="email" id="email-input" name="email" placeholder="Enter your email" required>

                    <input type="submit" value="Sent Verification Code" id="send-code-button">
                    
                    <div class="back-to-login">
                        <a href="SignIn_page.html">← Back to Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
