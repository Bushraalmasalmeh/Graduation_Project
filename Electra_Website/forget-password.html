<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ELECTRA</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="row min-vh-100 justify-content-center align-items-center">
            <div class="col-12">
                <form id="forgot-password-form" class="login-form" style="height: auto;">
                    
                    <p style="font-size: 1.5rem; font-weight: 600;font-family:var( --font-logo);color: var( --primary-color);">Forget Your Password?</p>
                    <p style="font-weight: 300; font-size: 0.9rem; line-height: 1.5;">
                        Enter the email address associated with your account.
                    </p>

                    <label for="email-input">Email Address</label>
                    <input type="email" id="email-input" name="email" placeholder="ID@std-zuj.edu.jo" required>

                    <input type="submit" value="Sent Verification Code" id="send-code-button">
                    
                    <div style="text-align: center; margin-top: 15px;">
                        <a href="login.html">← Back to Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
