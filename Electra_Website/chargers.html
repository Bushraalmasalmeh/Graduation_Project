                </li>
                <li class="sidebar-item">

                </li>
                <li class="sidebar-item">

                </div>

                <table class="table custom-table">
                    <thead>
                        <tr>
                            <th>Station ID</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="chargers-table-body">
                        <tr>
                            <td>Station 001</td>
                            <td>Health Center</td>
                            <td><span class="status confirmed">Available</span></td>
                            <td>
                                <button class="btn btn-sm btn-secondary-custom">Edit</button>
                                <button class="btn btn-sm btn-danger-custom">Remove</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Station 002</td>
                            <td>IT College</td>
                            <td><span class="status pending">In Use</span></td>

                                <button class="btn btn-sm btn-secondary-custom">Edit</button>
                                <button class="btn btn-sm btn-danger-custom">Remove</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Station 003</td>
                            <td>Business College</td>
                            <td><span class="status cancelled">Offline</span></td>
                            <td>
                                <button class="btn btn-sm btn-secondary-custom">Edit</button>
                                <button class="btn btn-sm btn-danger-custom">Remove</button>
