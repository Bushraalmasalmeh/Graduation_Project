<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Charger</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    </link>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="sidebar-header">
                    <h3>ELECTRA</h3>
                </div>
                <ul class="sidebar-nav">
                    <li class="sidebar-item"><a href="dashboard.html"><i
                                class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
                    <li class="sidebar-item active"><a href="chargers.html"><i
                                class="fas fa-charging-station"></i><span>Chargers</span></a></li>
                    <li class="sidebar-item"><a href="users.html"><i class="fas fa-users"></i><span>Users</span></a>
                    </li>
                    <li class="sidebar-item"><a href="bookings.html"><i
                                class="fas fa-calendar-check"></i><span>Bookings</span></a></li>
                    <li class="sidebar-item"><a href="reports.html"><i
                                class="fas fa-file-alt"></i><span>Reports</span></a></li>
                </ul>
            </div>
            <div class="sidebar-footer">
                <ul class="sidebar-nav">
                    <li class="sidebar-item"><a href="settings.html"><i class="fas fa-cog"></i><span>Settings</span></a>
                    </li>
                </ul>
            </div>
        </aside>
        <main class="main-content" id="main-content">
            <nav class="navbar">
                <div class="container-fluid">
                    <button class="btn btn-outline-light d-lg-none me-3" id="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand">Edit Charger</span>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 flex-row">
                        <li class="nav-item me-3"><a class="nav-link" href="notifications.html"><i
                                    class="fas fa-bell"></i></a></li>
                        <li class="nav-item"><a class="nav-link" href="settings.html"><i
                                    class="fas fa-user-circle"></i></a></li>
                    </ul>
                </div>
            </nav>
            <div class="container-fluid content-inner">
                <div class="add-form-container">
                    <form id="edit-charger-form">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="charger-name">Charger Name</label>
                                <input type="text" id="charger-name" name="charger_name" value="Station 001" required>
                            </div>
                              <div class="col-md-6 mb-3">
                                <label for="cabinets">Number of Cabinets</label>
                                <input type="number" id="cabinets" name="cabinets" value="3" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="charger-location">Location</label>
                                <input type="text" id="charger-location" name="charger_location" value="Health Center"
                                    required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="charger-status">Status</label>
                                <select id="charger-status" name="charger_status" required>
                                    <option value="active" selected>Active</option>
                                    <option value="maintenance">Maintenance</option>
                                    <option value="offline">Offline</option>
                                </select>
                           
                        </div>

                        <div class="mt-4 text-end">
                            <a href="chargers.html" class="btn btn-secondary-custom me-2">Cancel</a>
                            <input type="submit" class="btn-submit-custom" value="Update Charger">
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api-client.js"></script>
    
    <script src="assets/js/app.js"></script>
</body>
</body>

</html>
