<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ELECTRA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="container">
        <div class="row min-vh-100 justify-content-center align-items-center">
            <div class="col-12">
                <form id="login-form" class="login-form">
                    <h1>ELECTRA</h1>
                    <p>Please Sign in To Manage Charging Stations</p>

                    <label for="email-input">Email Address</label>
                    <input type="email" id="email-input" name="email" placeholder="Enter your email" required>
                    
                    <br> <label for="password-input">Password</label>
                    <input type="password" id="password-input" name="password" placeholder="Enter your password" required>

                    <div class="login-footer">
                        <div class="remember-me-section">
                            <input type="checkbox" id="remember-me-check">
                            <span>Remember Me</span>
                        </div>
                        <a href="forget-password.html">Forgot Your Password?</a>
                    </div>

                    <input type="submit" value="Sign in" id="login-button">
                </form>
            </div>
        </div>
    </div>

</body>
</html>
