<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <form action="" class="login-form">
        <h1>Electra</h1>
        <p>Please Sign in To Manage Charging Stations</p>


        <label for="email">Email Address</label>
        <input type="text" id="email" name="email" placeholder="Enter your Email" required><br><br>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your Password" required><br><br>
        
        <div class="login-footer">
            <div>
                <input type="checkbox" value="checkbox" id="rememberMe">
                <span for="rememberMe">Remember Me</span>
            </div>
            <a href="reset_password.html">forget password?</a>
        </div>
        
        <input type="submit" value="Sign In">
    </form>

</body>
</html>
