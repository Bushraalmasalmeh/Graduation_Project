<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Inbox</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    </link>
    <icon rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
    <div class="d-flex" id="wrapper">
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="sidebar-header">
                    <h3>ELECTRA</h3>
                </div>
                <ul class="sidebar-nav">
                    <li class="sidebar-item"><a href="dashboard.html"><i
                                class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
                    <li class="sidebar-item"><a href="chargers.html"><i
                                class="fas fa-charging-station"></i><span>Chargers</span></a></li>
                    <li class="sidebar-item"><a href="users.html"><i class="fas fa-users"></i><span>Users</span></a>
                    </li>
                    <li class="sidebar-item"><a href="bookings.html"><i
                                class="fas fa-calendar-check"></i><span>Bookings</span></a></li>
                    <li class="sidebar-item"><a href="reports.html"><i
                                class="fas fa-file-alt"></i><span>Reports</span></a></li>
                    <li class="sidebar-item active"><a href="support.html"><i
                                class="fas fa-envelope-open-text"></i><span>Inbox</span></a></li>
                </ul>
            </div>
            <div class="sidebar-footer">
                <ul class="sidebar-nav">
                    <li class="sidebar-item"><a href="settings.html"><i class="fas fa-cog"></i><span>Settings</span></a>
                    </li>
                </ul>
            </div>
        </aside>
        <main class="main-content" id="main-content">
            <nav class="navbar">
                <div class="container-fluid">
                    <button class="btn btn-outline-light d-lg-none me-3" id="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand">Support Inbox</span>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 flex-row">
                        <li class="nav-item me-3"><a class="nav-link" href="notifications.html"><i
                                    class="fas fa-bell"></i></a></li>
                        <li class="nav-item"><a class="nav-link" href="setting.html"><i
                                    class="fas fa-user-circle"></i></a></li>
                    </ul>
                </div>
            </nav>
            <div class="container-fluid content-inner">
                <p class="text-muted mb-4">View and manage user complaints and system reports.</p>

                <div class="content-box">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="content-box-title">Recent Messages</h5>

                        <select id="support-filter-status" class="filter-select" style="width: auto;">
                            <option value="all">All Messages</option>
                            <option value="New">New</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                    </div>

                    <table class="table custom-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Subject</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="support-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api-client.js"></script>
    
    <script src="assets/js/app.js"></script>
</body>
</body>

</html>
