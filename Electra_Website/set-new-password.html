<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - ELECTRA</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="container">
        <div class="row min-vh-100 justify-content-center align-items-center">
            <div class="col-12">
                <form id="set-password-form" class="login-form" style="margin-top: 170px;">
               
                    
                    <p class="form-title" style="color: var(--primary-color);font-weight: 600; margin-bottom: 20px;">Set New Password</p>

                    <label for="new-password-input">New Password</label>
                    <input type="password" id="new-password-input" name="new_password" placeholder="Enter New Password" required>
                    
                    <br> <label for="confirm-password-input" style="margin-top: 10px;">Confirm Password</label>
                    <input type="password" id="confirm-password-input" name="confirm_password" placeholder="Confirm New Password" required>

                    <input type="submit" value="Save Password" id="save-password-button">
                </form>
            </div>
        </div>
    </div>

</body>
</html>
