                <li class="sidebar-item">

        <main class="main-content" id="main-content">
            <nav class="navbar">

                    <span class="navbar-brand">User Profile</span>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 flex-row">
                        <li class="nav-item me-3"><a class="nav-link" href="notifications.html"><i class="fas fa-bell"></i></a></li>

                    </ul>
                </div>
            </nav>
            <div class="container-fluid content-inner">
                <a href="users.html" class="back-link mb-4"><i class="fas fa-arrow-left me-2"></i>Back to User List</a>

                <div class="row">
                    <div class="col-lg-7">
                        <div class="profile-card">
                            <div class="profile-header">
                                <i class="fas fa-user-circle profile-avatar"></i>
                                <div class="profile-info">
                                    <h4 class="profile-name">Islam Noor</h4>
                                    <p class="profile-email text-muted">islamabukhalaf5@gmail.com</p>
                                    <span class="status confirmed">Active</span>
                                </div>
                            </div>
                            <hr class="profile-divider">
                            <div class="profile-details">
                                <div class="detail-item">
                                    <span class="detail-label">Role</span>
                                    <span class="detail-value">Student</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Ticket ID</span>
                                    <span class="detail-value">111</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Member Since</span>
                                    <span class="detail-value">Oct 20, 2025</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Total Bookings</span>
                                    <span class="detail-value">12</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="profile-card">
                            <h5 class="card-section-title">Monthly Charging Limit</h5>
                            <form id="update-limit-form">
                                <label for="monthly-limit">Set Monthly Hours</label>
                                <input type="text" id="monthly-limit" name="monthly_limit" value="40h">
                                <div class="d-flex justify-content-end mt-3">
                                    <button type="submit" class="btn btn-primary-custom">Update Limit</button>
                                </div>
                            </form>
                            <hr class="profile-divider">
                            <h5 class="card-section-title">Account Actions</h5>
                            <button class="btn btn-danger-custom w-100">Delete User Account</button>
                        </div>
                    </div>
